spring:
  application:
    name: rag-customer-service

  elasticsearch:
    uris: http://localhost:9200

  datasource:
    url: jdbc:mysql://localhost:3306/ragdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username:
    password:

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

server:
  port: 8080

# RAG 配置
rag:
  embedding:
    dimension: 384
  chunk:
    size: 500
    overlap: 50
  similarity:
    threshold: 0.5
  top-k: 2

