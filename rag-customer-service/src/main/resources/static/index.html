<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG智能助手 - 小智</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            max-height: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            color: white;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-left .logo h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header-left .logo p {
            opacity: 0.9;
            font-size: 16px;
            margin-top: 0px;
            font-weight: 400;
        }

        .nav-menu {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-menu .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
            text-decoration: none;
        }

        .nav-menu .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .nav-menu .user-info {
            font-size: 13px;
            opacity: 0.9;
            padding: 4px 8px;
        }

        .nav-menu .nav-btn.logout-btn {
            background: rgba(231, 76, 60, 0.4);
            border-color: rgba(231, 76, 60, 0.5);
        }

        .nav-menu .nav-btn.logout-btn:hover {
            background: rgba(231, 76, 60, 0.6);
        }

        .nav-menu .nav-btn.admin-btn {
            background: rgba(241, 196, 15, 0.3);
            border-color: rgba(241, 196, 15, 0.4);
        }

        .nav-menu .nav-btn.admin-btn:hover {
            background: rgba(241, 196, 15, 0.5);
        }

        .model-selector {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
            max-width: 180px;
            transition: all 0.3s;
        }

        .model-selector:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .model-selector option {
            background: #333;
            color: white;
        }

        .chat-messages {
            flex: 1;
            padding: 14px 18px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
        }

        .message.bot .avatar {
            background: #667eea;
            color: white;
            margin-right: 10px;
        }

        .message.user .avatar {
            background: #764ba2;
            color: white;
            margin-left: 10px;
            order: 2;
        }

        .message .bubble-wrapper {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            line-height: 1.7;
            font-size: 14px;
            white-space: normal;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.bot .bubble {
            background: white;
            color: #333;
        }

        .message .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .message.user .timestamp {
            text-align: right;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .thinking .dots {
            display: flex;
            gap: 4px;
        }

        .thinking .dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: thinkingBounce 1.4s infinite both;
        }

        .thinking .dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .thinking .dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .thinking .dots span:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes thinkingBounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .thinking .label {
            font-size: 13px;
            color: #888;
            font-weight: 500;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #667eea;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%,
            50% {
                opacity: 1;
            }
            51%,
            100% {
                opacity: 0;
            }
        }

        .input-area {
            padding: 10px 18px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-area textarea {
            width: 100%;
            padding: 10px 14px;
            padding-right: 60px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
            background: #fafafa;
        }

        .input-area textarea:focus {
            border-color: #667eea;
            background: white;
        }

        .input-area textarea::placeholder {
            color: #aaa;
        }

        .char-count {
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-size: 11px;
            color: #bbb;
            user-select: none;
        }

        .char-count.limit {
            color: #e74c3c;
        }

        .input-area button {
            padding: 10px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            height: 44px;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px 30px;
            width: 550px;
            max-width: 92%;
            max-height: 80vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 4px;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .modal .close-btn:hover {
            color: #333;
        }

        .modal p.sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .history-session-item {
            padding: 12px 14px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-session-item:hover {
            background: #f0f3ff;
            border-color: #667eea;
            transform: translateX(4px);
        }

        .history-session-item .title {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .history-session-item .info {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            display: flex;
            gap: 16px;
        }

        .empty-history {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        .modal label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 14px;
        }

        .modal input:focus {
            border-color: #667eea;
        }

        .modal .btn-primary {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .modal .btn-primary:hover {
            opacity: 0.9;
        }

        .modal .toggle-mode {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }

        .modal .toggle-mode a {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .modal .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .modal .success-msg {
            color: #27ae60;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .chat-messages::-webkit-scrollbar,
        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track,
        .modal::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb,
        .modal::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <div class="logo">
                    <h1>🤖 RAG智能助手小智</h1>
                </div>
            </div>
            <div class="nav-menu">
                <span class="user-info" id="userInfo">👤 游客</span>
                <select class="model-selector" id="modelSelector" onchange="switchModel()">
                    <option value="">加载中...</option>
                </select>
                <button class="nav-btn" id="newChatBtn" onclick="newChat()">➕ 新对话</button>
                <button class="nav-btn" id="loginBtn" onclick="showLoginModal()">登录</button>
                <button class="nav-btn" id="historyBtn" onclick="showHistory()">📜 历史会话</button>
                <a href="/admin.html" class="nav-btn admin-btn" id="adminBtn" style="display:none;">⚙️ 管理</a>
                <button class="nav-btn logout-btn" id="logoutBtn" onclick="logout()" style="display:none;">退出</button>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="avatar">🤖</div>
            <div class="bubble-wrapper">
                <div class="bubble">你好！我是小智，你的智能助手。有什么可以帮你的吗？</div>
                <div class="timestamp">刚刚</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="messageInput" rows="1" placeholder="输入您的问题..." oninput="autoResize()"></textarea>
            <span class="char-count" id="charCount">0/200</span>
        </div>
        <button id="sendButton" onclick="sendMessageStream()">发送</button>
    </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h2 id="modalTitle">登录</h2>
        <p class="sub" id="modalSub">登录后保存对话历史</p>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码">
        <div id="registerFields" style="display:none;">
            <label>邮箱</label>
            <input type="email" id="loginEmail" placeholder="请输入邮箱（可选）">
        </div>
        <button class="btn-primary" id="modalBtn" onclick="handleLogin()">登录</button>
        <div class="toggle-mode">
            <span id="toggleText">还没有账号？</span>
            <a id="toggleLink" onclick="toggleAuthMode()">注册</a>
        </div>
    </div>
</div>

<!-- 历史会话弹窗 -->
<div class="modal-overlay" id="historyModal">
    <div class="modal">
        <h2>
            📜 历史会话
            <button class="close-btn" onclick="closeHistory()">×</button>
        </h2>
        <p class="sub">点击会话可继续对话</p>
        <div id="historyList">
            <div class="empty-history">暂无历史记录</div>
        </div>
    </div>
</div>

<script>
    // 未登录跳转到登录页
    if (!localStorage.getItem('token')) {
        window.location.href = '/login.html';
    }
    // ============================================================
    //  全局变量
    // ============================================================
    let sessionId = localStorage.getItem('sessionId');
    if (!sessionId) {
        sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('sessionId', sessionId);
    }

    let isStreaming = false;
    let isLoginMode = true;
    let token = localStorage.getItem('token');
    let currentUser = localStorage.getItem('username');

    console.log('🔍 初始化 - 当前用户:', currentUser);
    console.log('🔍 初始化 - 会话ID:', sessionId);

    // ============================================================
    //  工具函数
    // ============================================================
    function generateSessionId() {
        return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getWelcomeMessage() {
        return `
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble-wrapper">
                    <div class="bubble">你好！我是小智，你的智能助手。有什么可以帮你的吗？</div>
                    <div class="timestamp">刚刚</div>
                </div>
            </div>
        `;
    }

    // ============================================================
    //  模型切换
    // ============================================================
    async function loadModels() {
        try {
            const response = await fetch('/api/model/list');
            const result = await response.json();

            if (result.success) {
                const selector = document.getElementById('modelSelector');
                selector.innerHTML = '';

                result.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = model.name;
                    if (model.id === result.current) {
                        option.selected = true;
                    }
                    selector.appendChild(option);
                });
            }
        } catch (error) {
            console.error('加载模型列表失败:', error);
        }
    }

    async function switchModel() {
        const selector = document.getElementById('modelSelector');
        const model = selector.value;

        if (!model) return;

        try {
            const response = await fetch('/api/model/switch?model=' + encodeURIComponent(model), {
                method: 'POST'
            });

            const result = await response.json();

            if (result.success) {
                addMessage('bot', '🔄 已切换到：' + selector.options[selector.selectedIndex].text);
            } else {
                addMessage('bot', '⚠️ ' + result.message);
            }
        } catch (error) {
            console.error('切换模型失败:', error);
            addMessage('bot', '⚠️ 切换模型失败');
        }
    }

    // ============================================================
    //  导航栏更新
    // ============================================================
    function updateNavbar() {
        const userInfo = document.getElementById('userInfo');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminBtn = document.getElementById('adminBtn');

        token = localStorage.getItem('token');
        currentUser = localStorage.getItem('username');

        if (token && currentUser) {
            userInfo.textContent = '👤 ' + currentUser;
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';

            if (currentUser === 'admin') {
                adminBtn.style.display = 'inline-block';
            } else {
                adminBtn.style.display = 'none';
            }
        } else {
            userInfo.textContent = '👤 游客';
            loginBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            adminBtn.style.display = 'none';
        }
    }

    // ============================================================
    //  输入框控制
    // ============================================================
    function autoResize() {
        const input = document.getElementById('messageInput');
        const charCount = document.getElementById('charCount');
        const maxLength = 200;

        if (input.value.length > maxLength) {
            input.value = input.value.substring(0, maxLength);
        }

        charCount.textContent = input.value.length + '/' + maxLength;
        charCount.className = 'char-count' + (input.value.length > maxLength * 0.9 ? ' limit' : '');

        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }

    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessageStream();
        }
    });

    // ============================================================
    //  登录 / 注册
    // ============================================================
    function showLoginModal() {
        if (token) {
            logout();
            return;
        }
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('errorMsg').textContent = '';
        document.getElementById('successMsg').textContent = '';
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.remove('active');
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            document.getElementById('modalTitle').textContent = '登录';
            document.getElementById('modalSub').textContent = '登录后保存对话历史';
            document.getElementById('modalBtn').textContent = '登录';
            document.getElementById('toggleText').textContent = '还没有账号？';
            document.getElementById('toggleLink').textContent = '注册';
            document.getElementById('registerFields').style.display = 'none';
        } else {
            document.getElementById('modalTitle').textContent = '注册';
            document.getElementById('modalSub').textContent = '创建账号，保存对话历史';
            document.getElementById('modalBtn').textContent = '注册';
            document.getElementById('toggleText').textContent = '已有账号？';
            document.getElementById('toggleLink').textContent = '登录';
            document.getElementById('registerFields').style.display = 'block';
        }
        document.getElementById('errorMsg').textContent = '';
        document.getElementById('successMsg').textContent = '';
    }

    async function handleLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const email = document.getElementById('loginEmail').value.trim();

        if (!username || !password) {
            document.getElementById('errorMsg').textContent = '请填写用户名和密码';
            return;
        }

        const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
        const body = isLoginMode ? { username, password } : { username, password, email };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (data.success) {
                if (isLoginMode) {
                    token = data.token;
                    currentUser = data.username;
                    localStorage.setItem('token', token);
                    localStorage.setItem('username', currentUser);
                    closeLoginModal();
                    updateNavbar();
                    addMessage('bot', '✅ 登录成功！欢迎回来，' + currentUser);
                } else {
                    document.getElementById('successMsg').textContent = '注册成功！请登录';
                    document.getElementById('errorMsg').textContent = '';
                    document.getElementById('loginUsername').value = '';
                    document.getElementById('loginPassword').value = '';
                    if (!isLoginMode) {
                        setTimeout(function() {
                            toggleAuthMode();
                        }, 1200);
                    }
                }
            } else {
                document.getElementById('errorMsg').textContent = data.message || '操作失败，请重试';
                document.getElementById('successMsg').textContent = '';
            }
        } catch (error) {
            console.error('请求失败:', error);
            document.getElementById('errorMsg').textContent = '网络错误，请检查网络连接';
            document.getElementById('successMsg').textContent = '';
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('rememberMe');
        localStorage.removeItem('tokenExpire');
        token = null;
        currentUser = null;
        updateNavbar();
        addMessage('bot', '👋 已退出登录');
        // 跳转到登录页
        window.location.href = '/login.html';
    }

    document.getElementById('loginModal').addEventListener('click', function(e) {
        if (e.target === this) closeLoginModal();
    });

    // ============================================================
    //  新对话
    // ============================================================
    async function newChat() {
        try {
            await fetch('/api/chat/context?sessionId=' + sessionId, {
                method: 'DELETE'
            });

            sessionId = generateSessionId();
            localStorage.setItem('sessionId', sessionId);
            console.log('🆕 新会话ID:', sessionId);

            const container = document.getElementById('chatMessages');
            container.innerHTML = getWelcomeMessage();
            addMessage('bot', '🗑️ 已开始新对话！');
        } catch (error) {
            console.error('新对话失败:', error);
            addMessage('bot', '⚠️ 新对话失败，请重试');
        }
    }

    // ============================================================
    //  历史会话
    // ============================================================
    function showHistory() {
        currentUser = localStorage.getItem('username');
        if (!currentUser) {
            addMessage('bot', '⚠️ 请先登录查看历史会话');
            return;
        }
        const modal = document.getElementById('historyModal');
        modal.classList.add('active');
        loadSessionList();
    }

    function closeHistory() {
        document.getElementById('historyModal').classList.remove('active');
    }

    async function loadSessionList() {
        const container = document.getElementById('historyList');
        currentUser = localStorage.getItem('username');

        if (!currentUser) {
            container.innerHTML = '<div class="empty-history">请先登录</div>';
            return;
        }

        try {
            const url = '/api/chat/sessions?username=' + encodeURIComponent(currentUser);
            const response = await fetch(url);
            const result = await response.json();

            if (!result.success) {
                container.innerHTML = '<div class="empty-history">' + (result.message || '加载失败') + '</div>';
                return;
            }

            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<div class="empty-history">暂无历史会话</div>';
                return;
            }

            let html = '';
            result.data.forEach(function(session) {
                const lastTime = session.lastTime ? formatTime(session.lastTime) : '未知时间';
                const isCurrent = session.sessionId === sessionId;
                html += `
                    <div class="history-session-item" onclick="restoreSession('${session.sessionId}')">
                        <div class="title">💬 ${escapeHtml(session.title)} ${isCurrent ? '（当前会话）' : ''}</div>
                        <div class="info">
                            <span>📝 ${session.messageCount} 条消息</span>
                            <span>🕐 ${lastTime}</span>
                            <span style="color:#667eea;">点击继续对话 →</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        } catch (error) {
            console.error('加载会话列表失败:', error);
            container.innerHTML = '<div class="empty-history">加载失败，请重试</div>';
        }
    }

    // ============================================================
    //  恢复会话
    // ============================================================
    async function restoreSession(targetSessionId) {
        if (!targetSessionId) return;

        try {
            closeHistory();
            sessionId = targetSessionId;
            localStorage.setItem('sessionId', sessionId);

            const response = await fetch('/api/chat/session/' + targetSessionId);
            const result = await response.json();

            if (!result.success) {
                addMessage('bot', '⚠️ 加载会话失败');
                return;
            }

            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const messages = result.data;
            if (messages && messages.length > 0) {
                addMessage('bot', '📂 已恢复会话，可以继续对话');

                for (const msg of messages) {
                    addMessage('user', msg.question);
                    addMessage('bot', msg.answer);
                }
            } else {
                addMessage('bot', '📭 会话为空');
            }
        } catch (error) {
            console.error('恢复会话失败:', error);
            addMessage('bot', '⚠️ 恢复会话失败，请重试');
        }
    }

    document.getElementById('historyModal').addEventListener('click', function(e) {
        if (e.target === this) closeHistory();
    });

    // ============================================================
    //  发送消息
    // ============================================================
    async function sendMessageStream() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        const sendButton = document.getElementById('sendButton');

        if (!message || isStreaming) return;

        input.value = '';
        input.style.height = 'auto';
        document.getElementById('charCount').textContent = '0/200';
        sendButton.disabled = true;
        isStreaming = true;

        addMessage('user', message);
        const messageId = addBotMessagePlaceholderWithThinking();

        try {
            currentUser = localStorage.getItem('username');

            const response = await fetch('/api/chat/ask/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    sessionId: sessionId,
                    userId: currentUser || null
                })
            });

            if (!response.ok) throw new Error('请求失败: ' + response.status);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullContent = '';
            let buffer = '';
            let hasStarted = false;

            const wrapper = document.querySelector('#' + messageId + ' .bubble-wrapper');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('data:')) {
                        let data = trimmedLine.substring(5).trim();
                        if (!data || data === '') continue;

                        try {
                            const json = JSON.parse(data);
                            let content = null;

                            if (json.content) content = json.content;
                            else if (json.message) content = json.message;
                            else if (json.data && json.data.content) content = json.data.content;
                            else if (json.delta && json.delta.content) content = json.delta.content;
                            else if (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) {
                                content = json.choices[0].delta.content;
                            }

                            if (content) {
                                if (!hasStarted) {
                                    hasStarted = true;
                                    wrapper.innerHTML = `
                                        <div class="bubble"></div>
                                        <div class="timestamp">生成中...</div>
                                    `;
                                }
                                fullContent += content;
                                const newBubble = document.querySelector('#' + messageId + ' .bubble');
                                if (newBubble) {
                                    newBubble.textContent = fullContent + '|';
                                }
                                scrollToBottom();
                            }
                        } catch (e) {
                            if (data && data.length > 0 && !data.startsWith('{')) {
                                if (!hasStarted) {
                                    hasStarted = true;
                                    wrapper.innerHTML = `
                                        <div class="bubble"></div>
                                        <div class="timestamp">生成中...</div>
                                    `;
                                }
                                fullContent += data;
                                const newBubble = document.querySelector('#' + messageId + ' .bubble');
                                if (newBubble) {
                                    newBubble.textContent = fullContent + '|';
                                }
                                scrollToBottom();
                            }
                        }
                    }
                }
            }

            const finalBubble = document.querySelector('#' + messageId + ' .bubble');
            if (finalBubble) {
                if (fullContent) {
                    finalBubble.textContent = fullContent;
                } else {
                    finalBubble.textContent = '（回答为空）';
                }
            }
            updateTimestamp(messageId);

        } catch (error) {
            console.error('流式请求失败:', error);
            const errorEl = document.getElementById(messageId);
            if (errorEl) {
                const bubble = errorEl.querySelector('.bubble');
                if (bubble) {
                    bubble.textContent = '❌ 请求失败: ' + error.message;
                }
            }
        } finally {
            sendButton.disabled = false;
            isStreaming = false;
            input.focus();
        }
    }

    // ============================================================
    //  UI 辅助函数
    // ============================================================
    function addMessage(type, content) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + type;

        const avatar = type === 'user' ? '👤' : '🤖';
        const timestamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

        messageDiv.innerHTML = `
            <div class="avatar">${avatar}</div>
            <div class="bubble-wrapper">
                <div class="bubble">${escapeHtml(content)}</div>
                <div class="timestamp">${timestamp}</div>
            </div>
        `;

        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    function addBotMessagePlaceholderWithThinking() {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        const id = 'msg_' + Date.now();
        messageDiv.id = id;
        messageDiv.className = 'message bot';

        messageDiv.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="bubble-wrapper">
                <div class="bubble">
                    <div class="thinking">
                        <span class="label">🤔 思考中</span>
                        <div class="dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="timestamp">生成中...</div>
            </div>
        `;

        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        return id;
    }

    function updateTimestamp(messageId) {
        const element = document.getElementById(messageId);
        if (element) {
            const ts = element.querySelector('.timestamp');
            if (ts) {
                ts.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
        }
    }

    // ============================================================
    //  初始化
    // ============================================================
    updateNavbar();
    loadModels();

    console.log('✅ RAG智能助手（小智）已启动');
    console.log('📌 会话ID:', sessionId);
    console.log('👤 用户:', currentUser || '游客');
</script>
